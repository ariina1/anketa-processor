{% extends "base.html" %}
{% block title %}Добавить анкету{% endblock %}
{% block content %}
<div class="card">
    <h2>Добавление новой анкеты</h2>
    
    {% if error %}
        <div class="alert alert-danger">⚠️ Ошибка: {{ error }}</div>
    {% endif %}
    
    <form method="POST">
        <div class="form-group">
            <label>Тип анкеты</label>
            <select name="tip">
                <option value="s" {% if data.tip == 's' %}selected{% endif %}>Студент</option>
                <option value="t" {% if data.tip == 't' %}selected{% endif %}>Преподаватель</option>
            </select>
        </div>
        <div class="form-group">
            <label>ФИО</label>
            <input type="text" name="fio" value="{{ data.fio or '' }}" placeholder="Иванов Иван Иванович" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="text" name="mail" value="{{ data.mail or '' }}" placeholder="example@mail.ru" required>
        </div>
        <div class="form-group">
            <label>Телефон</label>
            <input type="text" name="phone" value="{{ data.phone or '' }}" placeholder="+7 (999) 123-45-67" required>
        </div>
        <div class="form-group">
            <label>Группа или Кафедра</label>
            <input type="text" name="extra" value="{{ data.extra or '' }}" placeholder="09c33 или И9" required>
        </div>
        <button type="submit">Отправить анкету</button>
    </form>
</div>
{% endblock %}
